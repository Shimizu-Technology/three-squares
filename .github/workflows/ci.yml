name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: three_squares_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/three_squares_ci_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Prepare test database
        run: bin/rails db:prepare
      - name: Verify fresh migration replay matches schema
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/three_squares_ci_replay
        run: |
          # Rails 8.1 otherwise initializes an empty DB from the existing dump.
          SCHEMA="$RUNNER_TEMP/migration-replay.rb" bin/rails db:create db:migrate
          diff -u db/schema.rb "$RUNNER_TEMP/migration-replay.rb"
      - name: Run RSpec
        run: bundle exec rspec
      - name: Scan Rails security
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Verify lint regression gate
        run: npm run test:ci-tools
      - name: Test web logic
        run: npm run test:unit
      - name: Lint without adding inherited errors
        run: npm run lint:ci
      - name: Typecheck and build
        run: npm run build
      - name: Install geometry browsers
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Check shared UI geometry
        run: npm run ui:geometry
      - name: Retain geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-geometry
          path: tmp/ui-geometry/
          if-no-files-found: ignore
          retention-days: 7
